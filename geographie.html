<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Geografie-Quiz</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="geo.css">
</head>
<body>
    <header class="geo-header">
        <h1>Geografie-Quiz</h1>
        <p>Klicke auf die Karte und benenne das getroffene Land.</p>
        <a href="index.html" class="back-link">Zurück zur Mathe-App</a>
    </header>

    <div id="map"></div>

    <div id="hud" class="hud hidden">
        <div class="hud-row">
            <span id="prompt">Welches Land ist das?</span>
        </div>
        <div class="hud-row">
            <input id="countryInput" placeholder="Land eingeben">
            <button id="checkBtn">Prüfen</button>
            <button id="skipBtn" class="secondary">Überspringen</button>
        </div>
        <div class="hud-row small">
            <span id="feedback"></span>
        </div>
        <div class="hud-row stats">
            <span>Richtig: <strong id="correct">0</strong></span>
            <span>Falsch: <strong id="wrong">0</strong></span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="geo.js"></script>
</body>
</html>
